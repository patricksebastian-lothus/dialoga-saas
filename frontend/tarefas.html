<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tarefas - dIAloga+</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/app-shell.css"><style>.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow:auto}.col{border:1px solid var(--border);border-radius:14px;background:#fff;min-height:420px;padding:12px}.task{border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;background:#fafafa}.task-title{font-weight:900}.task-meta{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.dot{width:9px;height:9px;border-radius:999px;display:inline-block;margin-right:7px}body.dark-mode .col{background:#171d2b;border-color:#262e40}body.dark-mode .task{background:#101827;border-color:#262e40}</style></head><body class="app-shell-body"><script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script><div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content"><div class="flex justify-between items-center mb-3"><p class="text-muted" style="margin:0;">Ações da equipe: confirmar, reagendar, ligar, cobrar retorno e concluir pendências.</p><button class="btn btn-primary" id="btn-new">Nova tarefa</button></div><div id="alert-area"></div><div class="kanban" id="board"><div class="empty-state"><div class="spinner"></div></div></div></main></div></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>if(window.WFLayout)WFLayout.render({active:"tarefas",title:"Tarefas",subtitle:"Operação da equipe"});</script><script>(async function(){const alertArea=document.getElementById('alert-area');let tasks=[],leads=[];const cols=[['sem_status','Sem status','#94a3b8'],['pendente','Pendente','#f97316'],['em_andamento','Em andamento','#3b82f6'],['aguardando_resposta','Aguardando resposta','#8b5cf6'],['concluida','Concluída','#22c55e']];function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5000)}function fmt(iso){if(!iso)return'-';try{return new Date(iso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch{return iso}}function render(){document.getElementById('board').innerHTML=cols.map(c=>'<div class="col"><strong><span class="dot" style="background:'+c[2]+'"></span>'+c[1]+'</strong><small class="text-muted"> · '+tasks.filter(t=>t.status===c[0]).length+'</small>'+tasks.filter(t=>t.status===c[0]).map(taskHtml).join('')+'</div>').join('');bind()}function taskHtml(t){return '<div class="task"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta">'+esc(t.lead_name||'Sem contato')+' · prazo '+fmt(t.due_at)+' · '+esc(t.priority)+'</div><p style="font-size:13px;margin:8px 0 0">'+esc(t.description||'')+'</p><div class="actions"><button class="btn btn-secondary btn-sm" data-move="'+t.id+'">Status</button><button class="btn btn-secondary btn-sm" data-edit="'+t.id+'">Editar</button><button class="btn btn-danger btn-sm" data-del="'+t.id+'">Excluir</button></div></div>'}function payload(existing){const title=prompt('Título da tarefa:',existing?existing.title:'');if(title===null||!title.trim())return null;const description=prompt('Descrição:',existing?(existing.description||''):'');if(description===null)return null;const leadId=prompt('ID do contato/lead (opcional):',existing?(existing.lead_id||''):'');if(leadId===null)return null;const due=prompt('Prazo ISO opcional (ex: 2026-08-20T14:00:00):',existing?(existing.due_at||''):'');if(due===null)return null;return{title:title.trim(),description,status:existing?(existing.status||'pendente'):'pendente',task_type:'follow_up',lead_id:leadId?Number(leadId):null,due_at:due||null,assigned_to:null,priority:'normal'}}function bind(){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{const t=tasks.find(x=>x.id==b.dataset.move);const st=prompt('Status: sem_status, pendente, em_andamento, aguardando_resposta, concluida',t.status);if(!st)return;try{await WFApi.crmUpdateTask(t.id,{lead_id:t.lead_id,title:t.title,description:t.description,status:st,task_type:t.task_type,due_at:t.due_at,assigned_to:t.assigned_to,priority:t.priority});await load();alert('Status atualizado.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const t=tasks.find(x=>x.id==b.dataset.edit);const p=payload(t);if(!p)return;p.status=t.status;try{await WFApi.crmUpdateTask(t.id,p);await load();alert('Tarefa atualizada.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir tarefa?'))return;try{await WFApi.crmDeleteTask(b.dataset.del);await load();alert('Tarefa excluída.','success')}catch(e){alert(e.message)}})}async function load(){tasks=await WFApi.crmTasks();render()}document.getElementById('btn-new').onclick=async()=>{const p=payload(null);if(!p)return;try{await WFApi.crmCreateTask(p);await load();alert('Tarefa criada.','success')}catch(e){alert(e.message)}};const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert(e.message)}})();</script></body></html>
