<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Respostas rápidas - dIAloga+</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/app-shell.css"><style>.reply-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.reply-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px}.reply-content{white-space:pre-wrap;font-size:13px;color:var(--text);margin-top:8px}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dbeafe;color:#1e40af}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}body.dark-mode .reply-card{background:#171d2b;border-color:#262e40}</style></head><body class="app-shell-body"><script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script><div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content"><div class="flex justify-between items-center mb-3"><p class="text-muted" style="margin:0;">Modelos internos para atendimento humano no Inbox.</p><div class="flex gap-2"><button class="btn btn-secondary" id="btn-bootstrap">Criar base Emagrecentro</button><button class="btn btn-primary" id="btn-new">Nova resposta</button></div></div><div id="alert-area"></div><div class="reply-grid" id="items"><div class="empty-state"><div class="spinner"></div></div></div></main></div></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>if(window.WFLayout)WFLayout.render({active:"respostas",title:"Respostas rápidas",subtitle:"Atendimento humano"});</script><script>(async function(){const alertArea=document.getElementById('alert-area');let items=[];function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5000)}function render(){const el=document.getElementById('items');if(!items.length){el.innerHTML='<div class="empty-state">Nenhuma resposta rápida cadastrada.</div>';return}el.innerHTML=items.map(i=>'<div class="reply-card"><div><strong>'+esc(i.title)+'</strong> '+(i.category?'<span class="badge">'+esc(i.category)+'</span>':'')+'</div><div class="reply-content">'+esc(i.content)+'</div><div class="actions"><button class="btn btn-secondary btn-sm" data-copy="'+i.id+'">Copiar</button><button class="btn btn-secondary btn-sm" data-edit="'+i.id+'">Editar</button><button class="btn btn-danger btn-sm" data-del="'+i.id+'">Excluir</button></div></div>').join('');bind()}function payload(existing){const title=prompt('Título:',existing?existing.title:'');if(title===null||!title.trim())return null;const category=prompt('Categoria:',existing?(existing.category||''):'Atendimento');if(category===null)return null;const content=prompt('Mensagem:',existing?(existing.content||''):'');if(content===null||!content.trim())return null;return{title:title.trim(),category:category.trim()||null,content:content.trim(),is_active:true}}function bind(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const it=items.find(x=>x.id==b.dataset.copy);try{await navigator.clipboard.writeText(it.content);alert('Resposta copiada.','success')}catch(e){alert('Copie manualmente: '+it.content,'info')}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const it=items.find(x=>x.id==b.dataset.edit);const p=payload(it);if(!p)return;try{await WFApi.crmUpdateQuickReply(it.id,p);await load();alert('Resposta atualizada.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir resposta?'))return;try{await WFApi.crmDeleteQuickReply(b.dataset.del);await load();alert('Resposta excluída.','success')}catch(e){alert(e.message)}})}async function load(){items=await WFApi.crmQuickReplies();render()}document.getElementById('btn-new').onclick=async()=>{const p=payload(null);if(!p)return;try{await WFApi.crmCreateQuickReply(p);await load();alert('Resposta criada.','success')}catch(e){alert(e.message)}};document.getElementById('btn-bootstrap').onclick=async()=>{try{const r=await WFApi.crmBootstrapEmagrecentro();await load();alert('Base criada/atualizada: '+JSON.stringify(r.created),'success')}catch(e){alert(e.message)}};const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert(e.message)}})();</script></body></html>
