<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatos - dIAloga+</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <style>
    .contacts-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters .form-control{max-width:220px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.metric{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px}.metric strong{font-size:22px;display:block}.metric span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}.contacts-table{width:100%;font-size:13px}.contacts-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--border)}.contacts-table td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top}.contact-cell{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:999px;background:#0b61d8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}.name{font-weight:900;color:var(--text)}.sub{font-size:12px;color:var(--muted);margin-top:2px}.tag-list{display:flex;gap:4px;flex-wrap:wrap}.tag{border-radius:999px;background:#eef2ff;color:#3730a3;padding:3px 7px;font-size:11px;font-weight:800}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dbeafe;color:#1e40af}.badge.ok{background:#dcfce7;color:#166534}.badge.err{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.actions{display:flex;gap:6px;flex-wrap:wrap}.custom-mini{display:flex;gap:4px;flex-wrap:wrap;max-width:280px}.custom-chip{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:3px 7px;color:var(--muted)}.crm-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.crm-modal{width:min(1000px,96vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.crm-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}.crm-modal-body{padding:18px 20px}.crm-modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}.sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.sheet-section{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}.sheet-section h3{font-size:15px;margin:0 0 10px}.field label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:5px;display:block}.field input,.field textarea,.field select{width:100%}.tag-checks{display:flex;flex-wrap:wrap;gap:8px}.tag-check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 9px;font-size:12px}.tag-color{width:9px;height:9px;border-radius:999px;display:inline-block}.empty{padding:48px;text-align:center;color:var(--muted)}body.dark-mode .metric,body.dark-mode .crm-modal,body.dark-mode .sheet-section{background:#171d2b;border-color:#262e40}body.dark-mode .contacts-table th,body.dark-mode .contacts-table td,body.dark-mode .crm-modal-head,body.dark-mode .crm-modal-foot,body.dark-mode .tag-check,body.dark-mode .custom-chip{border-color:#262e40}@media(max-width:900px){.contacts-table{min-width:980px}.table-wrap{overflow:auto}}
  </style>
</head>
<body class="app-shell-body">
<script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script>
<div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content">
  <div class="contacts-toolbar"><p class="text-muted" style="margin:0;">Base operacional de contatos, oportunidades, etiquetas e campos da unidade.</p><div class="flex gap-2"><button class="btn btn-secondary" id="btn-bootstrap">Criar base Emagrecentro</button><button class="btn btn-secondary" id="btn-export">Exportar CSV</button><button class="btn btn-primary" id="btn-new-contact">Novo contato</button></div></div>
  <div id="alert-area"></div>
  <section class="metrics"><div class="metric"><strong id="m-total">0</strong><span>Total</span></div><div class="metric"><strong id="m-whatsapp">0</strong><span>WhatsApp</span></div><div class="metric"><strong id="m-open">0</strong><span>Em aberto</span></div><div class="metric"><strong id="m-won">0</strong><span>Convertidos</span></div><div class="metric"><strong id="m-lost">0</strong><span>Perdidos</span></div></section>
  <section class="filters"><input class="form-control" id="q" placeholder="Buscar contatos..."><select class="form-control" id="f-tag"><option value="">Todas etiquetas</option></select><select class="form-control" id="f-pipeline"><option value="">Todos pipelines</option></select><select class="form-control" id="f-stage"><option value="">Todas etapas</option></select><select class="form-control" id="f-status"><option value="">Todos status</option><option value="novo">Novo</option><option value="em_atendimento">Bot atendendo</option><option value="em_atendimento_humano">Humano atendendo</option><option value="qualificado">Qualificado</option><option value="convertido">Convertido</option><option value="perdido">Perdido</option><option value="encerrado">Encerrado</option></select><select class="form-control" id="f-source"><option value="">Todas origens</option><option value="__real__">Somente reais</option><option value="manual">Manual</option><option value="whatsapp_evolution">WhatsApp QR</option><option value="whatsapp_meta">WhatsApp Oficial</option><option value="simulator">Simulador</option></select><select class="form-control" id="f-field"><option value="">Campo personalizado</option></select><input class="form-control" id="f-field-value" placeholder="Valor do campo"></section>
  <section class="card"><div class="table-wrap"><table class="contacts-table"><thead><tr id="thead-row"><th>Contato</th><th>Telefone</th><th>Etiquetas</th><th>Pipeline</th><th>Status</th><th>Origem</th><th class="custom-th">Campos</th><th>Criado</th><th>Ações</th></tr></thead><tbody id="tbody"><tr><td colspan="9"><div class="empty"><div class="spinner"></div></div></td></tr></tbody></table></div></section>

  <div class="crm-modal-backdrop" id="sheet-modal"><div class="crm-modal" role="dialog" aria-modal="true"><div class="crm-modal-head"><div><h2 id="sheet-title" style="font-size:20px;margin:0;">Ficha do contato</h2><p id="sheet-sub" class="text-muted" style="margin:4px 0 0;"></p></div><button class="btn btn-secondary btn-sm" id="sheet-close">Fechar</button></div><div class="crm-modal-body" id="sheet-body"></div><div class="crm-modal-foot"><button class="btn btn-secondary" id="sheet-task">Criar tarefa</button><button class="btn btn-primary" id="sheet-save">Salvar ficha</button></div></div></div>
</main></div></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>if(window.WFLayout)WFLayout.render({active:"leads",title:"Contatos",subtitle:"CRM operacional da unidade"});</script>
<script>
(async function(){
 const alertArea=document.getElementById('alert-area');let leads=[],tags=[],fields=[],pipelines=[],fieldValues={},sheetLeadId=null;
 const statusLabels={novo:'Novo',em_atendimento:'Bot atendendo',aguardando_humano:'Aguardando humano',em_atendimento_humano:'Humano atendendo',qualificado:'Qualificado',convertido:'Convertido',perdido:'Perdido',encerrado:'Encerrado'};
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5500)}
 function fmt(iso){if(!iso)return'-';try{return new Date(iso).toLocaleDateString('pt-BR')}catch{return iso}}
 function initials(l){const s=(l.name||l.phone||'C').trim();return s.charAt(0).toUpperCase()||'C'}
 function display(l){return l.name||l.phone||('Contato #'+l.id)}
 function sourceLabel(s){return {manual:'Manual',whatsapp_evolution:'WhatsApp QR',whatsapp_meta:'WhatsApp Oficial',simulator:'Simulador'}[s]||s||'-'}
 function stageName(type,slug){const p=pipelines.find(x=>x.name===type);const st=p&&((p.stages||[]).find(s=>s.slug===slug));return st?st.name:(slug||'novo')}
 function stageObj(l){const p=pipelines.find(x=>x.name===l.pipeline_type);return p&&((p.stages||[]).find(s=>s.slug===l.pipeline_stage))||null}
 function visibleFields(){return fields.filter(f=>f.show_in_table&&f.is_active).slice(0,4)}
 function populateFilters(){const ft=document.getElementById('f-tag');ft.innerHTML='<option value="">Todas etiquetas</option>'+tags.map(t=>'<option>'+esc(t.name)+'</option>').join('');const fp=document.getElementById('f-pipeline');fp.innerHTML='<option value="">Todos pipelines</option>'+pipelines.map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>').join('');populateStageFilter();const ff=document.getElementById('f-field');ff.innerHTML='<option value="">Campo personalizado</option>'+fields.map(f=>'<option value="'+esc(f.key)+'">'+esc(f.name)+'</option>').join('')}
 function populateStageFilter(){const val=document.getElementById('f-pipeline').value;let sts=[];pipelines.filter(p=>!val||p.name===val).forEach(p=>(p.stages||[]).forEach(s=>sts.push(s)));document.getElementById('f-stage').innerHTML='<option value="">Todas etapas</option>'+sts.map(s=>'<option value="'+esc(s.slug)+'">'+esc(s.name)+'</option>').join('')}
 function filtered(){const q=document.getElementById('q').value.toLowerCase().trim();const tag=document.getElementById('f-tag').value.toLowerCase();const pipe=document.getElementById('f-pipeline').value;const stage=document.getElementById('f-stage').value;const status=document.getElementById('f-status').value;const source=document.getElementById('f-source').value;const fk=document.getElementById('f-field').value;const fv=document.getElementById('f-field-value').value.toLowerCase().trim();return leads.filter(l=>{if(tag&&!((l.tags||[]).map(t=>String(t).toLowerCase()).includes(tag)))return false;if(pipe&&l.pipeline_type!==pipe)return false;if(stage&&l.pipeline_stage!==stage)return false;if(status&&l.status!==status)return false;if(source==='__real__'&&l.source==='simulator')return false;if(source&&source!=='__real__'&&l.source!==source)return false;if(fk&&fv&&!String((fieldValues[String(l.id)]||{})[fk]||'').toLowerCase().includes(fv))return false;if(q){const custom=JSON.stringify(fieldValues[String(l.id)]||{});const hay=[l.name,l.phone,l.email,l.status,l.source,l.pipeline_type,l.pipeline_stage,(l.tags||[]).join(' '),custom].join(' ').toLowerCase();if(!hay.includes(q))return false}return true})}
 function renderMetrics(list){document.getElementById('m-total').textContent=list.length;document.getElementById('m-whatsapp').textContent=list.filter(l=>String(l.source||'').startsWith('whatsapp')).length;document.getElementById('m-open').textContent=list.filter(l=>!['convertido','perdido','encerrado'].includes(l.status)).length;document.getElementById('m-won').textContent=list.filter(l=>l.status==='convertido').length;document.getElementById('m-lost').textContent=list.filter(l=>l.status==='perdido').length}
 function render(){const list=filtered();renderMetrics(list);const vf=visibleFields();document.querySelector('.custom-th').textContent=vf.length?'Campos':'Campos';const tb=document.getElementById('tbody');if(!list.length){tb.innerHTML='<tr><td colspan="9"><div class="empty">Nenhum contato encontrado.</div></td></tr>';return}tb.innerHTML=list.map(l=>{const vals=fieldValues[String(l.id)]||{};const st=stageObj(l);const custom=vf.map(f=>vals[f.key]?'<span class="custom-chip"><strong>'+esc(f.name)+':</strong> '+esc(vals[f.key])+'</span>':'').join('')||'<span class="sub">-</span>';return '<tr><td><div class="contact-cell"><div class="avatar">'+esc(initials(l))+'</div><div><div class="name">'+esc(display(l))+'</div><div class="sub">ID '+l.id+' · '+esc(l.email||'sem email')+'</div></div></div></td><td>'+esc(l.phone||'-')+'</td><td><div class="tag-list">'+(l.tags||[]).slice(0,5).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></td><td><span class="badge">'+esc(l.pipeline_type||'generic')+'</span><div class="sub">'+(st?'<span class="tag" style="background:'+esc(st.color||'#eef2ff')+'22;color:inherit">'+esc(st.name)+'</span>':esc(stageName(l.pipeline_type,l.pipeline_stage)))+'</div></td><td><span class="badge '+(l.status==='convertido'?'ok':(l.status==='perdido'?'err':''))+'">'+esc(statusLabels[l.status]||l.status||'-')+'</span></td><td>'+esc(sourceLabel(l.source))+'</td><td><div class="custom-mini">'+custom+'</div></td><td>'+fmt(l.created_at)+'</td><td><div class="actions"><button class="btn btn-primary btn-sm" data-sheet="'+l.id+'">Ficha</button><button class="btn btn-secondary btn-sm" data-task="'+l.id+'">Tarefa</button><button class="btn btn-danger btn-sm" data-del="'+l.id+'">Excluir</button></div></td></tr>'}).join('');bindRows()}
 function fieldInput(f){const value=f.value||'';const label='<label>'+esc(f.name)+'</label>';if(f.field_type==='textarea')return '<div class="field">'+label+'<textarea class="form-control" rows="3" data-cf="'+esc(f.key)+'">'+esc(value)+'</textarea></div>';if(f.field_type==='boolean')return '<div class="field">'+label+'<select class="form-control" data-cf="'+esc(f.key)+'"><option value="">Não informado</option><option value="sim" '+(value==='sim'?'selected':'')+'>Sim</option><option value="não" '+(value==='não'?'selected':'')+'>Não</option></select></div>';const type=f.field_type==='date'?'date':(f.field_type==='number'?'number':'text');return '<div class="field">'+label+'<input class="form-control" type="'+type+'" data-cf="'+esc(f.key)+'" value="'+esc(value)+'"></div>'}
 async function openSheet(id){sheetLeadId=Number(id);const l=leads.find(x=>x.id===sheetLeadId);if(!l)return;document.getElementById('sheet-modal').style.display='flex';document.getElementById('sheet-title').textContent=display(l);document.getElementById('sheet-sub').textContent=(l.phone||'Sem telefone')+' · '+sourceLabel(l.source);document.getElementById('sheet-body').innerHTML='<div class="empty"><div class="spinner"></div></div>';let ficha={custom_fields:[],notes:[],tasks:[],appointments:[]};try{ficha=await WFApi.crmLeadFicha(l.id)}catch(e){try{ficha.custom_fields=await WFApi.crmLeadCustomValues(l.id)}catch(_){}}const vals=ficha.custom_fields||[];const selectedTags=new Set((l.tags||[]).map(t=>String(t).toLowerCase()));const tagHtml=tags.length?tags.map(t=>'<label class="tag-check"><input type="checkbox" data-sheet-tag="'+esc(t.name)+'" '+(selectedTags.has(String(t.name).toLowerCase())?'checked':'')+'><span class="tag-color" style="background:'+esc(t.color||'#3b82f6')+'"></span>'+esc(t.name)+'</label>').join(''):'<p class="text-muted">Nenhuma etiqueta cadastrada.</p>';let pipeOptions='<option value="">Sem pipeline</option>';pipelines.forEach(p=>(p.stages||[]).forEach(s=>{const val=p.name+'||'+s.slug;pipeOptions+='<option value="'+esc(val)+'" '+(l.pipeline_type===p.name&&l.pipeline_stage===s.slug?'selected':'')+'>'+esc(p.name+' / '+s.name)+'</option>'}));const notesHtml=(ficha.notes||[]).length?(ficha.notes||[]).map(n=>'<div class="custom-chip" style="display:block;border-radius:10px;padding:8px 10px;margin-bottom:6px">'+esc(n.content)+'<div class="sub">'+esc(fmt(n.created_at))+'</div></div>').join(''):'<p class="text-muted">Nenhuma nota ainda.</p>';const tasksHtml=(ficha.tasks||[]).length?(ficha.tasks||[]).map(t=>'<div class="custom-chip" style="display:block;border-radius:10px;padding:8px 10px;margin-bottom:6px"><strong>'+esc(t.title)+'</strong> · '+esc(t.status||'')+'<div class="sub">'+(t.due_at?('Prazo '+esc(fmt(t.due_at))):'Sem prazo')+'</div></div>').join(''):'<p class="text-muted">Nenhuma tarefa neste contato.</p>';const apptHtml=(ficha.appointments||[]).length?(ficha.appointments||[]).map(a=>'<div class="custom-chip" style="display:block;border-radius:10px;padding:8px 10px;margin-bottom:6px">'+esc(a.title)+' · '+esc(a.status||'')+'<div class="sub">'+esc(fmt(a.scheduled_at))+'</div></div>').join(''):'<p class="text-muted">Nenhum agendamento vinculado.</p>';document.getElementById('sheet-body').innerHTML='<div class="sheet-section"><h3>Dados principais</h3><div class="sheet-grid"><div class="field"><label>Nome</label><input class="form-control" id="s-name" value="'+esc(l.name||'')+'"></div><div class="field"><label>Telefone</label><input class="form-control" id="s-phone" value="'+esc(l.phone||'')+'"></div><div class="field"><label>Email</label><input class="form-control" id="s-email" value="'+esc(l.email||'')+'"></div><div class="field"><label>Status</label><select class="form-control" id="s-status">'+Object.keys(statusLabels).map(k=>'<option value="'+k+'" '+((l.status||'novo')===k?'selected':'')+'>'+esc(statusLabels[k])+'</option>').join('')+'</select></div><div class="field"><label>Pipeline / etapa</label><select class="form-control" id="s-pipeline">'+pipeOptions+'</select></div></div></div><div class="sheet-section"><h3>Etiquetas</h3><div class="tag-checks">'+tagHtml+'</div></div><div class="sheet-section"><h3>Campos personalizados</h3><p class="text-muted" style="font-size:13px;margin-top:-4px;">Unidade, avaliação, procedimento, anúncio e condições.</p><div class="sheet-grid">'+(vals.length?vals.map(fieldInput).join(''):'<p class="text-muted">Nenhum campo personalizado ativo. Use “Criar base Emagrecentro”.</p>')+'</div></div><div class="sheet-section"><h3>Notas internas</h3>'+notesHtml+'<div class="field" style="margin-top:10px"><label>Nova nota</label><textarea class="form-control" id="s-note" rows="2" placeholder="Observação da consultora..."></textarea></div><button class="btn btn-secondary btn-sm" type="button" id="s-note-btn">Salvar nota</button></div><div class="sheet-section"><h3>Tarefas</h3>'+tasksHtml+'</div><div class="sheet-section"><h3>Agenda</h3>'+apptHtml+'</div>';const nb=document.getElementById('s-note-btn');if(nb)nb.onclick=async()=>{const txt=(document.getElementById('s-note').value||'').trim();if(!txt)return;try{await WFApi.createLeadNote(sheetLeadId,{content:txt});await openSheet(sheetLeadId);alert('Nota salva.','success')}catch(e){alert(e.message)}}}
 async function saveSheet(){if(!sheetLeadId)return;const tagsSelected=Array.from(document.querySelectorAll('[data-sheet-tag]:checked')).map(i=>i.dataset.sheetTag);const body={name:document.getElementById('s-name').value.trim()||null,phone:document.getElementById('s-phone').value.trim()||null,email:document.getElementById('s-email').value.trim()||null,status:document.getElementById('s-status').value,tags:tagsSelected};const pv=document.getElementById('s-pipeline').value;if(pv){const parts=pv.split('||');body.pipeline_type=parts[0];body.pipeline_stage=parts[1]}const values={};document.querySelectorAll('[data-cf]').forEach(el=>values[el.dataset.cf]=el.value);try{await WFApi.updateLead(sheetLeadId,body);await WFApi.crmSetLeadCustomValues(sheetLeadId,values);document.getElementById('sheet-modal').style.display='none';await load();alert('Ficha salva.','success')}catch(e){alert('Erro ao salvar: '+e.message)}}
 async function createTask(id){const l=leads.find(x=>x.id===Number(id));if(!l)return;const title=prompt('Título da tarefa:','Retornar contato');if(!title)return;const description=prompt('Descrição:','Contato: '+display(l));if(description===null)return;try{await WFApi.crmCreateTask({lead_id:l.id,title,description,status:'pendente',task_type:'follow_up',due_at:null,assigned_to:null,priority:'normal'});alert('Tarefa criada.','success')}catch(e){alert(e.message)}}
 function bindRows(){document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>createTask(b.dataset.task));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir contato permanentemente?'))return;try{await WFApi.deleteLead(b.dataset.del);await load();alert('Contato excluído.','success')}catch(e){alert(e.message)}})}
 async function newContact(){const name=prompt('Nome do contato:');if(name===null)return;const phone=prompt('Telefone:', '');if(phone===null)return;const email=prompt('Email opcional:', '');if(email===null)return;try{const l=await WFApi.createLead({name:name.trim()||null,phone:phone.trim()||null,email:email.trim()||null,source:'manual',status:'novo',tags:[]});await load();await openSheet(l.id);alert('Contato criado.','success')}catch(e){alert(e.message)}}
 async function load(){leads=await WFApi.listLeads();tags=await WFApi.crmTags();fields=await WFApi.crmCustomFields();pipelines=await WFApi.crmPipelines();fieldValues=await WFApi.crmContactFieldValues();populateFilters();render()}
 ['q','f-tag','f-stage','f-status','f-source','f-field','f-field-value'].forEach(id=>document.getElementById(id).addEventListener(id==='q'||id==='f-field-value'?'input':'change',render));document.getElementById('f-pipeline').addEventListener('change',()=>{populateStageFilter();render()});document.getElementById('btn-new-contact').onclick=newContact;document.getElementById('sheet-close').onclick=()=>document.getElementById('sheet-modal').style.display='none';document.getElementById('sheet-save').onclick=saveSheet;document.getElementById('sheet-task').onclick=()=>{if(sheetLeadId)createTask(sheetLeadId)};document.getElementById('btn-bootstrap').onclick=async()=>{try{const r=await WFApi.crmBootstrapEmagrecentro();await load();alert('Base criada/atualizada: '+JSON.stringify(r.created),'success')}catch(e){alert(e.message)}};document.getElementById('btn-export').onclick=()=>{fetch(WFApi.exportLeadsUrl(''),{headers:{Authorization:'Bearer '+WFApi.getToken()}}).then(r=>r.blob()).then(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='contatos-dialoga.csv';a.click();URL.revokeObjectURL(url)})};
 const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert('Erro ao carregar contatos: '+e.message)}
})();
</script></body></html>
