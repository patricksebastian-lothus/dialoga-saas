<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Campos personalizados - dIAloga+</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/app-shell.css"><style>.crm-table{width:100%}.crm-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--border)}.crm-table td{padding:12px 10px;border-bottom:1px solid var(--border)}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dbeafe;color:#1e40af}.actions{display:flex;gap:8px;flex-wrap:wrap}body.dark-mode .crm-table th,body.dark-mode .crm-table td{border-color:#262e40}</style></head><body class="app-shell-body"><script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script><div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content"><div class="flex justify-between items-center mb-3"><p class="text-muted" style="margin:0;">Campos extras para ficha do contato, qualificação, agenda e migração Northclinic.</p><div class="flex gap-2"><button class="btn btn-secondary" id="btn-bootstrap">Criar base Emagrecentro</button><button class="btn btn-primary" id="btn-new">Novo campo</button></div></div><div id="alert-area"></div><section class="card"><div id="items"><div class="empty-state"><div class="spinner"></div></div></div></section></main></div></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>if(window.WFLayout)WFLayout.render({active:"campos",title:"Campos personalizados",subtitle:"Ficha do contato"});</script><script>(async function(){const alertArea=document.getElementById('alert-area');let items=[];function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5000)}function render(){const el=document.getElementById('items');if(!items.length){el.innerHTML='<div class="empty-state">Nenhum campo cadastrado.</div>';return}let html='<div class="table-wrap"><table class="crm-table"><thead><tr><th>Campo</th><th>Chave</th><th>Tipo</th><th>Tabela</th><th>Ordem</th><th>Ações</th></tr></thead><tbody>';items.forEach(i=>{html+='<tr><td><strong>'+esc(i.name)+'</strong></td><td>'+esc(i.key)+'</td><td><span class="badge">'+esc(i.field_type)+'</span></td><td>'+(i.show_in_table?'sim':'não')+'</td><td>'+esc(i.sort_order)+'</td><td><div class="actions"><button class="btn btn-secondary btn-sm" data-edit="'+i.id+'">Editar</button><button class="btn btn-danger btn-sm" data-del="'+i.id+'">Excluir</button></div></td></tr>'});html+='</tbody></table></div>';el.innerHTML=html;bind()}function payload(existing){const name=prompt('Nome do campo:',existing?existing.name:'');if(name===null||!name.trim())return null;const key=prompt('Chave técnica (opcional):',existing?(existing.key||''):'');if(key===null)return null;const type=prompt('Tipo: text, textarea, number, date, select, boolean',existing?(existing.field_type||'text'):'text');if(type===null)return null;const show=confirm('Mostrar este campo na tabela de contatos?');return{name:name.trim(),key:key.trim()||null,field_type:type.trim()||'text',options:[],required:false,show_in_table:show,sort_order:existing?(existing.sort_order||0):0,is_active:true}}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const it=items.find(x=>x.id==b.dataset.edit);const p=payload(it);if(!p)return;p.sort_order=it.sort_order;try{await WFApi.crmUpdateCustomField(it.id,p);await load();alert('Campo atualizado.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir campo e valores preenchidos?'))return;try{await WFApi.crmDeleteCustomField(b.dataset.del);await load();alert('Campo excluído.','success')}catch(e){alert(e.message)}})}async function load(){items=await WFApi.crmCustomFields();render()}document.getElementById('btn-new').onclick=async()=>{const p=payload(null);if(!p)return;try{await WFApi.crmCreateCustomField(p);await load();alert('Campo criado.','success')}catch(e){alert(e.message)}};document.getElementById('btn-bootstrap').onclick=async()=>{try{const r=await WFApi.crmBootstrapEmagrecentro();await load();alert('Base criada/atualizada: '+JSON.stringify(r.created),'success')}catch(e){alert(e.message)}};const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert(e.message)}})();</script></body></html>
