<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pipelines - dIAloga+</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/app-shell.css"><style>.pipe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.pipe-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px}.stage{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}.dot{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dbeafe;color:#1e40af}body.dark-mode .pipe-card{background:#171d2b;border-color:#262e40}body.dark-mode .stage{border-color:#262e40}</style></head><body class="app-shell-body"><script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script><div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content"><div class="flex justify-between items-center mb-3"><p class="text-muted" style="margin:0;">Funis comerciais para avaliação, comparecimento, compra e reativação.</p><div class="flex gap-2"><button class="btn btn-secondary" id="btn-bootstrap">Criar funil Emagrecentro</button><button class="btn btn-primary" id="btn-new">Novo pipeline</button></div></div><div id="alert-area"></div><div class="pipe-grid" id="items"><div class="empty-state"><div class="spinner"></div></div></div></main></div></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>if(window.WFLayout)WFLayout.render({active:"pipelines",title:"Pipelines",subtitle:"Funis de oportunidade"});</script><script>(async function(){const alertArea=document.getElementById('alert-area');let items=[];function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5000)}function render(){const el=document.getElementById('items');if(!items.length){el.innerHTML='<div class="empty-state">Nenhum pipeline cadastrado.</div>';return}el.innerHTML=items.map(p=>'<div class="pipe-card"><div><strong>'+esc(p.name)+'</strong> '+(p.is_default?'<span class="badge">padrão</span>':'')+'</div><p class="text-muted" style="font-size:13px">'+esc(p.description||'')+'</p><div>'+(p.stages||[]).map(s=>'<div class="stage"><span><span class="dot" style="background:'+esc(s.color||'#3b82f6')+'"></span>'+esc(s.name)+' <small>'+esc(s.probability||0)+'%</small></span><span><button class="btn btn-secondary btn-sm" data-edit-stage="'+s.id+'">Editar</button> <button class="btn btn-danger btn-sm" data-del-stage="'+s.id+'">Excluir</button></span></div>').join('')+'</div><div class="actions"><button class="btn btn-secondary btn-sm" data-stage="'+p.id+'">Nova etapa</button><button class="btn btn-secondary btn-sm" data-edit="'+p.id+'">Editar pipeline</button><button class="btn btn-danger btn-sm" data-del="'+p.id+'">Excluir</button></div></div>').join('');bind()}function pipePayload(existing){const name=prompt('Nome do pipeline:',existing?existing.name:'');if(name===null||!name.trim())return null;const description=prompt('Descrição:',existing?(existing.description||''):'');if(description===null)return null;return{name:name.trim(),description,is_default:existing?!!existing.is_default:false,is_active:true}}function stagePayload(existing){const name=prompt('Nome da etapa:',existing?existing.name:'');if(name===null||!name.trim())return null;const color=prompt('Cor HEX:',existing?(existing.color||'#3b82f6'):'#3b82f6');if(color===null)return null;const prob=Number(prompt('Probabilidade (%):',existing?(existing.probability||0):0)||0);const order=Number(prompt('Ordem:',existing?(existing.sort_order||0):0)||0);const isWon=confirm('É etapa ganha/comprou?');const isLost=!isWon&&confirm('É etapa perdida?');return{name:name.trim(),slug:null,color:color||'#3b82f6',sort_order:order,probability:prob,is_won:isWon,is_lost:isLost}}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const it=items.find(x=>x.id==b.dataset.edit);const p=pipePayload(it);if(!p)return;p.is_default=it.is_default;try{await WFApi.crmUpdatePipeline(it.id,p);await load();alert('Pipeline atualizado.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir pipeline e etapas?'))return;try{await WFApi.crmDeletePipeline(b.dataset.del);await load();alert('Pipeline excluído.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{const p=stagePayload(null);if(!p)return;try{await WFApi.crmCreateStage(b.dataset.stage,p);await load();alert('Etapa criada.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-edit-stage]').forEach(b=>b.onclick=async()=>{let st=null;items.forEach(p=>(p.stages||[]).forEach(s=>{if(s.id==b.dataset.editStage)st=s}));const p=stagePayload(st);if(!p)return;try{await WFApi.crmUpdateStage(st.id,p);await load();alert('Etapa atualizada.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del-stage]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir etapa?'))return;try{await WFApi.crmDeleteStage(b.dataset.delStage);await load();alert('Etapa excluída.','success')}catch(e){alert(e.message)}})}async function load(){items=await WFApi.crmPipelines();render()}document.getElementById('btn-new').onclick=async()=>{const p=pipePayload(null);if(!p)return;try{await WFApi.crmCreatePipeline(p);await load();alert('Pipeline criado.','success')}catch(e){alert(e.message)}};document.getElementById('btn-bootstrap').onclick=async()=>{try{const r=await WFApi.crmBootstrapEmagrecentro();await load();alert('Base criada/atualizada: '+JSON.stringify(r.created),'success')}catch(e){alert(e.message)}};const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert(e.message)}})();</script></body></html>
