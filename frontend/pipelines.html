<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipelines - dIAloga+</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <style>
    .pipe-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.pipe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.pipe-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px;position:relative}.pipe-card:hover{border-color:#3b82f6}.pipe-icon{width:36px;height:36px;border-radius:10px;background:#0b61d8;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-right:10px}.pipe-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.pipe-name{font-weight:900;font-size:16px}.pipe-desc{font-size:13px;color:var(--muted);margin:4px 0 12px}.pipe-meta{display:flex;gap:8px;flex-wrap:wrap}.badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dbeafe;color:#1e40af}.badge.ok{background:#dcfce7;color:#166534}.badge.err{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.stage-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 8px;font-size:11px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:999px;display:inline-block}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.board-wrap{display:none}.board-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.board-title{display:flex;align-items:center;gap:10px}.board-title h2{margin:0;font-size:22px}.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter-row input,.filter-row select{max-width:230px}.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,300px);gap:12px;overflow-x:auto;padding-bottom:12px;min-height:560px}.kanban-col{border:1px solid var(--border);border-radius:14px;background:#fff;min-height:540px;padding:12px}.kanban-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.kanban-col-title{font-weight:900}.drop-hint{border:1px dashed var(--border);border-radius:10px;min-height:64px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;margin-bottom:10px}.opp-card{border:1px solid var(--border);border-radius:12px;background:#fafafa;padding:12px;margin-bottom:10px}.opp-name{font-weight:900}.opp-sub{font-size:12px;color:var(--muted);margin-top:3px}.opp-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.tag-mini{font-size:10px;border-radius:999px;background:#eef2ff;color:#3730a3;padding:3px 6px}.opp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.config-panel{display:none;border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px;margin-bottom:14px}.config-stage{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}.config-stage-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.empty-wide{border:1px dashed var(--border);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}body.dark-mode .pipe-card,body.dark-mode .kanban-col,body.dark-mode .config-panel{background:#171d2b;border-color:#262e40}body.dark-mode .stage-pill,body.dark-mode .config-stage{border-color:#262e40}body.dark-mode .opp-card{background:#101827;border-color:#262e40}body.dark-mode .drop-hint,body.dark-mode .empty-wide{border-color:#262e40}
  </style>
</head>
<body class="app-shell-body">
<script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script>
<div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content">
  <section id="list-view">
    <div class="pipe-toolbar"><p class="text-muted" style="margin:0;">Funis comerciais para avaliação, comparecimento, compra e reativação.</p><div class="flex gap-2"><button class="btn btn-secondary" id="btn-bootstrap">Criar funil Emagrecentro</button><button class="btn btn-primary" id="btn-new">Novo pipeline</button></div></div>
    <div id="alert-area"></div>
    <div class="pipe-grid" id="items"><div class="empty-state"><div class="spinner"></div></div></div>
  </section>

  <section class="board-wrap" id="board-view">
    <div class="board-top"><div class="board-title"><button class="btn btn-secondary btn-sm" id="btn-back">Voltar</button><div><h2 id="board-name">Pipeline</h2><p class="text-muted" id="board-desc" style="margin:2px 0 0;"></p></div></div><div class="flex gap-2"><button class="btn btn-secondary" id="btn-config">Configurar</button><button class="btn btn-primary" id="btn-add-opportunity">Adicionar contato ao funil</button></div></div>
    <div class="filter-row"><input class="form-control" id="q" placeholder="Buscar oportunidade..."><select class="form-control" id="status-filter"><option value="open">Em aberto</option><option value="won">Ganha</option><option value="lost">Perdida</option><option value="all">Todas</option></select><span class="badge" id="count-open">0 em aberto</span><span class="badge ok" id="count-won">0 ganha</span><span class="badge err" id="count-lost">0 perdida</span></div>
    <div class="config-panel" id="config-panel"><div class="flex justify-between items-center"><div><strong>Configurar Pipeline</strong><p class="text-muted" style="font-size:13px;margin:4px 0 0;">Gerencie etapas. Automação ao entrar será ligada na fase de automações por evento.</p></div><button class="btn btn-secondary btn-sm" id="btn-add-stage">Nova etapa</button></div><div id="config-stages"></div></div>
    <div class="kanban" id="kanban"><div class="empty-state"><div class="spinner"></div></div></div>
  </section>
</main></div></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script>
<script>if(window.WFLayout)WFLayout.render({active:"pipelines",title:"Pipelines",subtitle:"Funis e oportunidades"});</script>
<script>
(async function(){
 const alertArea=document.getElementById('alert-area');let pipelines=[];let leads=[];let current=null;let configOpen=false;
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5000)}
 function firstStage(p){return ((p&&p.stages)||[])[0]||null}
 function stageSlugs(p){return new Set(((p&&p.stages)||[]).map(s=>s.slug))}
 function isInPipeline(lead,p){const slugs=stageSlugs(p);if(lead.pipeline_type===p.name)return true;if(slugs.has(lead.pipeline_stage))return true;if(p.is_default&&(lead.pipeline_type==='generic'||!lead.pipeline_type))return true;return false}
 function leadStage(lead,p){const slugs=stageSlugs(p);if(slugs.has(lead.pipeline_stage))return lead.pipeline_stage;const fs=firstStage(p);return fs?fs.slug:'sem_etapa'}
 function visibleLeads(p){const q=(document.getElementById('q')?.value||'').toLowerCase();const sf=document.getElementById('status-filter')?.value||'open';return leads.filter(l=>isInPipeline(l,p)).filter(l=>{const st=((p.stages||[]).find(s=>s.slug===leadStage(l,p))||{});if(sf==='won'&&!st.is_won)return false;if(sf==='lost'&&!st.is_lost)return false;if(sf==='open'&&(st.is_won||st.is_lost))return false;if(q){const hay=[l.name,l.phone,l.email,(l.tags||[]).join(' '),l.status].join(' ').toLowerCase();if(!hay.includes(q))return false}return true})}
 function opportunityCount(p){return leads.filter(l=>isInPipeline(l,p)).length}
 function renderList(){document.getElementById('list-view').style.display='block';document.getElementById('board-view').style.display='none';const el=document.getElementById('items');if(!pipelines.length){el.innerHTML='<div class="empty-state">Nenhum pipeline cadastrado.</div>';return}el.innerHTML=pipelines.map(p=>'<div class="pipe-card"><div class="pipe-head"><div><div class="pipe-name"><span class="pipe-icon">▥</span>'+esc(p.name)+' '+(p.is_default?'<span class="badge">padrão</span>':'')+'</div><div class="pipe-desc">'+esc(p.description||'Sem descrição')+'</div></div><button class="btn btn-secondary btn-sm" data-open="'+p.id+'">Abrir</button></div><div class="pipe-meta"><span class="stage-pill">'+esc((p.stages||[]).length)+' etapas</span><span class="stage-pill">'+opportunityCount(p)+' oportunidades</span></div><div class="actions"><button class="btn btn-primary btn-sm" data-open="'+p.id+'">Ver oportunidades</button><button class="btn btn-secondary btn-sm" data-config-list="'+p.id+'">Configurar etapas</button><button class="btn btn-secondary btn-sm" data-edit="'+p.id+'">Editar</button><button class="btn btn-danger btn-sm" data-del="'+p.id+'">Excluir</button></div></div>').join('');bindList()}
 function renderBoard(){if(!current)return;document.getElementById('list-view').style.display='none';document.getElementById('board-view').style.display='block';document.getElementById('board-name').textContent=current.name;document.getElementById('board-desc').textContent=current.description||'';const all=leads.filter(l=>isInPipeline(l,current));let won=0,lost=0,open=0;all.forEach(l=>{const st=(current.stages||[]).find(s=>s.slug===leadStage(l,current))||{};if(st.is_won)won++;else if(st.is_lost)lost++;else open++});document.getElementById('count-open').textContent=open+' em aberto';document.getElementById('count-won').textContent=won+' ganha';document.getElementById('count-lost').textContent=lost+' perdida';document.getElementById('config-panel').style.display=configOpen?'block':'none';renderConfig();const filtered=visibleLeads(current);const el=document.getElementById('kanban');if(!(current.stages||[]).length){el.innerHTML='<div class="empty-wide">Configure pelo menos uma etapa para usar o quadro.</div>';return}el.innerHTML=(current.stages||[]).map(s=>{const list=filtered.filter(l=>leadStage(l,current)===s.slug);return '<div class="kanban-col"><div class="kanban-col-head"><div class="kanban-col-title"><span class="dot" style="background:'+esc(s.color||'#3b82f6')+'"></span>'+esc(s.name)+' <small>'+list.length+'</small></div><button class="btn btn-secondary btn-sm" data-add-stage-lead="'+s.slug+'">+</button></div><div class="drop-hint">Adicione ou mova oportunidades</div>'+list.map(l=>cardHtml(l,s)).join('')+'</div>'}).join('');bindBoard()}
 function cardHtml(l,s){return '<div class="opp-card"><div class="opp-name">'+esc(l.name||l.phone||('Lead #'+l.id))+'</div><div class="opp-sub">'+esc(l.phone||'-')+' · ID '+l.id+'</div><div class="opp-tags">'+(l.tags||[]).slice(0,4).map(t=>'<span class="tag-mini">'+esc(t)+'</span>').join('')+'</div><div class="opp-actions"><button class="btn btn-secondary btn-sm" data-move="'+l.id+'">Mover</button><button class="btn btn-secondary btn-sm" data-open-lead="'+l.id+'">Contato</button></div></div>'}
 function renderConfig(){const el=document.getElementById('config-stages');if(!current)return;el.innerHTML=(current.stages||[]).map(s=>'<div class="config-stage"><div class="config-stage-top"><div><span class="dot" style="background:'+esc(s.color||'#3b82f6')+'"></span><strong>'+esc(s.name)+'</strong> <small>'+esc(s.probability||0)+'%</small> '+(s.is_won?'<span class="badge ok">ganha</span>':(s.is_lost?'<span class="badge err">perdida</span>':'<span class="badge">aberta</span>'))+'</div><div><button class="btn btn-secondary btn-sm" data-edit-stage="'+s.id+'">Editar</button> <button class="btn btn-danger btn-sm" data-del-stage="'+s.id+'">Excluir</button></div></div><p class="text-muted" style="font-size:12px;margin:8px 0 0;">Automação ao entrar: disponível na fase EMG-4.</p></div>').join('')}
 function pipePayload(existing){const name=prompt('Nome do pipeline:',existing?existing.name:'');if(name===null||!name.trim())return null;const description=prompt('Descrição:',existing?(existing.description||''):'');if(description===null)return null;return{name:name.trim(),description,is_default:existing?!!existing.is_default:false,is_active:true}}
 function stagePayload(existing){const name=prompt('Nome da etapa:',existing?existing.name:'');if(name===null||!name.trim())return null;const color=prompt('Cor HEX:',existing?(existing.color||'#3b82f6'):'#3b82f6');if(color===null)return null;const prob=Number(prompt('Probabilidade (%):',existing?(existing.probability||0):0)||0);const order=Number(prompt('Ordem:',existing?(existing.sort_order||0):0)||0);const kind=prompt('Tipo: aberto, ganha ou perdida',existing?(existing.is_won?'ganha':(existing.is_lost?'perdida':'aberto')):'aberto')||'aberto';return{name:name.trim(),slug:null,color:color||'#3b82f6',sort_order:order,probability:prob,is_won:kind.toLowerCase().startsWith('gan'),is_lost:kind.toLowerCase().startsWith('per')}}
 async function moveLead(leadId,stageSlug){const st=(current.stages||[]).find(s=>s.slug===stageSlug);const body={pipeline_type:current.name,pipeline_stage:stageSlug};if(st&&st.is_won)body.status='convertido';if(st&&st.is_lost)body.status='perdido';await WFApi.updateLead(leadId,body);await load(false);current=pipelines.find(p=>p.id===current.id);renderBoard()}
 function bindList(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=pipelines.find(p=>p.id==b.dataset.open);configOpen=false;renderBoard()});document.querySelectorAll('[data-config-list]').forEach(b=>b.onclick=()=>{current=pipelines.find(p=>p.id==b.dataset.configList);configOpen=true;renderBoard()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const it=pipelines.find(x=>x.id==b.dataset.edit);const p=pipePayload(it);if(!p)return;p.is_default=it.is_default;try{await WFApi.crmUpdatePipeline(it.id,p);await load();alert('Pipeline atualizado.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir pipeline e etapas?'))return;try{await WFApi.crmDeletePipeline(b.dataset.del);await load();alert('Pipeline excluído.','success')}catch(e){alert(e.message)}})}
 function bindBoard(){document.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{const opts=(current.stages||[]).map(s=>s.slug+' = '+s.name).join('\n');const slug=prompt('Mover para qual etapa?\n'+opts);if(!slug)return;try{await moveLead(Number(b.dataset.move),slug);alert('Oportunidade movida.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-open-lead]').forEach(b=>b.onclick=()=>{location.href='leads.html'});document.querySelectorAll('[data-add-stage-lead]').forEach(b=>b.onclick=async()=>{const id=Number(prompt('ID do contato/lead para adicionar nesta etapa:')||0);if(!id)return;try{await moveLead(id,b.dataset.addStageLead);alert('Contato adicionado ao funil.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-edit-stage]').forEach(b=>b.onclick=async()=>{let st=null;(current.stages||[]).forEach(s=>{if(s.id==b.dataset.editStage)st=s});const p=stagePayload(st);if(!p)return;try{await WFApi.crmUpdateStage(st.id,p);await load(false);current=pipelines.find(p=>p.id===current.id);renderBoard();alert('Etapa atualizada.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del-stage]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir etapa?'))return;try{await WFApi.crmDeleteStage(b.dataset.delStage);await load(false);current=pipelines.find(p=>p.id===current.id);renderBoard();alert('Etapa excluída.','success')}catch(e){alert(e.message)}})}
 async function load(renderNow=true){pipelines=await WFApi.crmPipelines();leads=await WFApi.listLeads();if(renderNow)renderList()}
 document.getElementById('btn-new').onclick=async()=>{const p=pipePayload(null);if(!p)return;try{await WFApi.crmCreatePipeline(p);await load();alert('Pipeline criado.','success')}catch(e){alert(e.message)}};
 document.getElementById('btn-bootstrap').onclick=async()=>{try{const r=await WFApi.crmBootstrapEmagrecentro();await load();alert('Base criada/atualizada: '+JSON.stringify(r.created),'success')}catch(e){alert(e.message)}};
 document.getElementById('btn-back').onclick=()=>{current=null;configOpen=false;renderList()};
 document.getElementById('btn-config').onclick=()=>{configOpen=!configOpen;renderBoard()};
 document.getElementById('btn-add-stage').onclick=async()=>{const p=stagePayload(null);if(!p||!current)return;try{await WFApi.crmCreateStage(current.id,p);await load(false);current=pipelines.find(x=>x.id===current.id);renderBoard();alert('Etapa criada.','success')}catch(e){alert(e.message)}};
 document.getElementById('btn-add-opportunity').onclick=async()=>{const fs=firstStage(current);if(!fs){alert('Crie uma etapa primeiro.');return}const id=Number(prompt('ID do contato/lead para adicionar ao funil:')||0);if(!id)return;try{await moveLead(id,fs.slug);alert('Contato adicionado ao funil.','success')}catch(e){alert(e.message)}};
 document.getElementById('q').addEventListener('input',renderBoard);document.getElementById('status-filter').addEventListener('change',renderBoard);
 const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert(e.message)}
})();
</script></body></html>
