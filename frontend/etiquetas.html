<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Etiquetas - dIAloga+</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/app-shell.css"><style>.crm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.crm-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:16px}.tag-dot{width:14px;height:14px;border-radius:999px;display:inline-block}.tag-name{font-weight:900}.tag-row{display:flex;align-items:center;gap:10px}.tag-meta{color:var(--muted);font-size:12px;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}body.dark-mode .crm-card{background:#171d2b;border-color:#262e40}</style></head><body class="app-shell-body"><script>if(localStorage.getItem("dialoga-dark-mode")==="1")document.body.classList.add("dark-mode");</script><div class="app-shell"><aside class="shell-sidebar" id="app-sidebar"></aside><div class="shell-main"><header class="shell-topbar"><div class="shell-title" id="app-topbar-title"></div><div class="shell-top-actions"><div id="app-topbar-actions"></div><div class="user-area" id="user-area"></div></div></header><main class="shell-content"><div class="flex justify-between items-center mb-3"><p class="text-muted" style="margin:0;">Gerencie classificações usadas em contatos, funis e automações.</p><div class="flex gap-2"><button class="btn btn-secondary" id="btn-bootstrap">Criar base Emagrecentro</button><button class="btn btn-primary" id="btn-new">Nova etiqueta</button></div></div><div id="alert-area"></div><div class="crm-grid" id="items"><div class="empty-state"><div class="spinner"></div></div></div></main></div></div><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>if(window.WFLayout)WFLayout.render({active:"etiquetas",title:"Etiquetas",subtitle:"CRM operacional"});</script><script>(async function(){const alertArea=document.getElementById('alert-area');let items=[];function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alert(m,t){alertArea.innerHTML='<div class="alert alert-'+(t||'error')+'">'+esc(m)+'</div>';setTimeout(()=>alertArea.innerHTML='',5000)}function render(){const el=document.getElementById('items');if(!items.length){el.innerHTML='<div class="empty-state">Nenhuma etiqueta cadastrada.</div>';return}el.innerHTML=items.map(i=>'<div class="crm-card"><div class="tag-row"><span class="tag-dot" style="background:'+esc(i.color||'#3b82f6')+'"></span><div><div class="tag-name">'+esc(i.name)+'</div><div class="tag-meta">'+esc(i.contacts_count||0)+' contato(s) · '+(i.is_active?'ativa':'inativa')+'</div></div></div><p class="text-muted" style="font-size:13px">'+esc(i.description||'')+'</p><div class="actions"><button class="btn btn-secondary btn-sm" data-edit="'+i.id+'">Editar</button><button class="btn btn-danger btn-sm" data-del="'+i.id+'">Excluir</button></div></div>').join('');bind()}function payload(existing){const name=prompt('Nome da etiqueta:',existing?existing.name:'');if(name===null||!name.trim())return null;const color=prompt('Cor HEX:',existing?(existing.color||'#3b82f6'):'#3b82f6');if(color===null)return null;const description=prompt('Descrição opcional:',existing?(existing.description||''):'');if(description===null)return null;return{name:name.trim(),color:color.trim()||'#3b82f6',description,is_active:true}}function bind(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const it=items.find(x=>x.id==b.dataset.edit);const p=payload(it);if(!p)return;try{await WFApi.crmUpdateTag(it.id,p);await load();alert('Etiqueta atualizada.','success')}catch(e){alert(e.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir etiqueta?'))return;try{await WFApi.crmDeleteTag(b.dataset.del);await load();alert('Etiqueta excluída.','success')}catch(e){alert(e.message)}})}async function load(){items=await WFApi.crmTags();render()}document.getElementById('btn-new').onclick=async()=>{const p=payload(null);if(!p)return;try{await WFApi.crmCreateTag(p);await load();alert('Etiqueta criada.','success')}catch(e){alert(e.message)}};document.getElementById('btn-bootstrap').onclick=async()=>{try{const r=await WFApi.crmBootstrapEmagrecentro();await load();alert('Base criada/atualizada: '+JSON.stringify(r.created),'success')}catch(e){alert(e.message)}};const user=await WFAuth.requireAuth();if(!user)return;WFAuth.renderUserChip(document.getElementById('user-area'),user);try{await load()}catch(e){alert(e.message)}})();</script></body></html>
